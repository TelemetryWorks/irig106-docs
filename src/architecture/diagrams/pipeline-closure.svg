<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1250" viewBox="0 0 1160 1250" role="img" aria-labelledby="title desc">
<title id="title">3 · Setup closure: initial and mid-recording</title><desc id="desc">Owner-directed planned sequence. Setup fragments join separately by channel. The first observed time candidate must be trusted for initial closure; later closure requires first-fragment SRCC=1. Outcomes are revisable. Eligible time headers seal runs before the same marker is dispatched to time. Completeness and adoption remain separate.</desc>
