<text x="420" y="914" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#183447">
<tspan x="420" dy="0">SAME time marker + eligible updated declarations → time (planned)</tspan>
</text>
<rect x="35" y="972" width="1090" height="270" fill="#fff"/>
<text x="45" y="995" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#183447">
<tspan x="45" dy="0">TIME: 0x11, or 0x12 from 106-17; ANY channel. First observed time untrusted → adoption withheld;</tspan>
<tspan x="45" dy="21">a later trusted packet never replaces the initial candidate. Channels 7/9 illustrate 106-11 setup.</tspan>
<tspan x="45" dy="21">FIRST-fragment SRCC=0: retransmission stays open/provisional, outside the mid-session extension.</tspan>
<tspan x="45" dy="28">After seal: same-channel +1 continuation, same FRMT/RCCVER → otherwise Complete becomes Ambiguous.</tspan>
<tspan x="45" dy="21">Finding: “possible premature time-boundary seal”; retain both readings, never rejoin.</tspan>
<tspan x="45" dy="21">Verified G\SHA matching sealed text alone can keep Complete; continuity and finding remain visible.</tspan>
<tspan x="45" dy="21">Mid-session Complete basis: “time-boundary seal (owner policy)”. Outcomes can be revised before publication.</tspan>
<tspan x="45" dy="21">INT-034 still applies; a cut attribute remains Incomplete. Spool-before-publish must reflect revisions.</tspan>
<tspan x="45" dy="25">Channel 0: 106-13/15 Format 1 (“as of 106-13”); 106-17+ Format 1 or 4. Conformance is edition-dependent.</tspan>
</text>
